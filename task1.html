<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex; 
             flex-direction: row;
            justify-content: center;
            background-image: url(https://images.unsplash.com/photo-1588345921523-c2dcdb7f1dcd?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        }
        .container{
            display: flex;
          margin: 200px;
           
        }
       .box1{
        height: 350px;
        width: 300px;
        box-shadow: 3px 3px 10px 8px black;
        border-radius: 15px;
        margin-right: 100px;
       }
       .box2{
        height: 350px;
        width: 300px;
         margin-right: 100px;
        box-shadow: 3px 3px 10px 8px black;
        border-radius: 15px;
       }
       h1{
        margin-top: 50px;
        text-align: center;
       }
       button{
        
          background-color: blue;
          height: 40px;
          width: 120px;
          position: relative;
          top: 80px;
          left: 90px;
          color: white;
          border: 2px black solid;
          border-radius: 10px;
       
       }
       .box3{
        height: 350px;
        width: 300px;
         margin-right: 100px;
         box-shadow: 3px 3px 10px 8px black;
        border-radius: 15px;
       }

    </style>
</head>
<body> 
    <div class="container">
        <div class="box1">
            <h1>Withdraw</h1>
            <button>Withdraw</button>
       </div>
        <div class="box2"> 
            <h1>Deposit</h1>
            <button>Deposit</button>
        </div>
        <div class="box3"> 
            <h1>Balance enquiry</h1>
            <button>Balance</button>
        </div>
    </div>
</body>
</html>
